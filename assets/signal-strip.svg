<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 120" role="img" aria-labelledby="title desc">
  <title id="title">Signal de mission Nzox</title>
  <desc id="desc">Bandeau spatial animé reliant construction, sécurité et exploration.</desc>
  <defs>
    <linearGradient id="signalGlow" x1="0" x2="1">
      <stop offset="0" stop-color="#52d4bd" stop-opacity="0"/>
      <stop offset=".5" stop-color="#52d4bd"/>
      <stop offset="1" stop-color="#f2a65a" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="1598" height="118" rx="18" fill="#081312" stroke="#24574f" stroke-width="2"/>
  <g stroke="#24574f" stroke-opacity=".35">
    <path d="M0 30h1600M0 60h1600M0 90h1600"/>
    <path d="M160 0v120M400 0v120M800 0v120M1200 0v120M1440 0v120"/>
  </g>
  <path d="M65 75C320 8 500 108 800 49s490 60 735-20" fill="none" stroke="#24574f" stroke-width="2"/>
  <path d="M65 75C320 8 500 108 800 49s490 60 735-20" fill="none" stroke="url(#signalGlow)" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 52" filter="url(#softGlow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-336" dur="7s" repeatCount="indefinite"/>
  </path>
  <g fill="#edf1e8">
    <circle cx="250" cy="24" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="571" cy="84" r="1.5"/>
    <circle cx="1030" cy="21" r="2"><animate attributeName="opacity" values="1;.2;1" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="1375" cy="94" r="1.5"/>
  </g>
  <circle cx="64" cy="75" r="7" fill="#52d4bd" filter="url(#softGlow)">
    <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="92" y="46" fill="#a7dcd2" font-family="Cascadia Code, monospace" font-size="15" font-weight="700" letter-spacing="2">NZOX // LIVE SIGNAL</text>
  <text x="800" y="76" fill="#edf1e8" font-family="Georgia, serif" font-size="25" text-anchor="middle" letter-spacing="5">BUILD  ·  SECURE  ·  EXPLORE</text>
  <text x="1508" y="46" fill="#7f9690" font-family="Cascadia Code, monospace" font-size="14" text-anchor="end">GUYANE / 2026</text>
</svg>
