<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 120" role="img" aria-labelledby="title desc">
  <title id="title">Signal de mission Nzox</title>
  <desc id="desc">Bandeau spatial animé reliant construction, sécurité et exploration.</desc>
  <defs>
    <linearGradient id="frame" x1="0" x2="1">
      <stop stop-color="#00e5ff"/>
      <stop offset=".5" stop-color="#6a24c8"/>
      <stop offset="1" stop-color="#f42cd6"/>
    </linearGradient>
    <linearGradient id="signalGlow" x1="0" x2="1">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset=".25" stop-color="#00e5ff"/>
      <stop offset=".58" stop-color="#8e35ff"/>
      <stop offset=".82" stop-color="#f42cd6"/>
      <stop offset="1" stop-color="#f42cd6" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="1598" height="118" rx="18" fill="#03020f" stroke="url(#frame)" stroke-opacity=".65" stroke-width="2"/>
  <g stroke="#635ca2" stroke-opacity=".18">
    <path d="M0 30h1600M0 60h1600M0 90h1600"/>
    <path d="M160 0v120M400 0v120M800 0v120M1200 0v120M1440 0v120"/>
  </g>
  <path d="M65 75C320 8 500 108 800 49s490 60 735-20" fill="none" stroke="#302a66" stroke-width="2"/>
  <path d="M65 75C320 8 500 108 800 49s490 60 735-20" fill="none" stroke="url(#signalGlow)" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 52" filter="url(#softGlow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-336" dur="7s" repeatCount="indefinite"/>
  </path>
  <g fill="#f7fbff">
    <circle cx="250" cy="24" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="571" cy="84" r="1.5"/>
    <circle cx="1030" cy="21" r="2"><animate attributeName="opacity" values="1;.2;1" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="1375" cy="94" r="1.5"/>
  </g>
  <circle cx="64" cy="75" r="7" fill="#00e5ff" filter="url(#softGlow)">
    <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="92" y="46" fill="#94f4ff" font-family="Cascadia Code, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="2">NZOX // LIVE SIGNAL</text>
  <text x="800" y="76" fill="#f7fbff" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" letter-spacing="5">BUILD  ·  SECURE  ·  EXPLORE</text>
  <text x="1508" y="46" fill="#b78cff" font-family="Cascadia Code, Consolas, monospace" font-size="14" text-anchor="end">GUYANE / 2026</text>
</svg>
