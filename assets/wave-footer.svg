<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 180" role="img" aria-labelledby="title">
  <title id="title">Vagues spatiales — construire, sécuriser, apprendre</title>
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#07112d"/>
      <stop offset=".5" stop-color="#150b3e"/>
      <stop offset="1" stop-color="#250a36"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" x2="1">
      <stop stop-color="#00e5ff"/>
      <stop offset=".5" stop-color="#7a2cff"/>
      <stop offset="1" stop-color="#f42cd6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="180" fill="#03020f"/>
  <path d="M0 106c202-72 320 54 527-10 218-68 317-96 530-23 190 65 326-18 543-43v150H0z" fill="url(#ocean)" fill-opacity=".72"/>
  <path d="M0 118c219-69 358 43 558-12 224-62 321-76 519-18 187 55 334-10 523-34" fill="none" stroke="url(#wave)" stroke-opacity=".88" stroke-width="3" filter="url(#glow)"/>
  <path d="M0 118c219-69 358 43 558-12 224-62 321-76 519-18 187 55 334-10 523-34" fill="none" stroke="#f7fbff" stroke-opacity=".9" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 42">
    <animate attributeName="stroke-dashoffset" from="0" to="-180" dur="5s" repeatCount="indefinite"/>
  </path>
  <path d="M0 139c211-42 360 45 558 5 226-45 337-60 531-12 183 45 330-2 511-20" fill="none" stroke="#f42cd6" stroke-opacity=".65" stroke-width="2"/>
  <path d="M0 139c211-42 360 45 558 5 226-45 337-60 531-12 183 45 330-2 511-20" fill="none" stroke="#ff6b2c" stroke-opacity=".95" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 74">
    <animate attributeName="stroke-dashoffset" from="-240" to="0" dur="8s" repeatCount="indefinite"/>
  </path>
  <g fill="#f7fbff" opacity=".8">
    <circle cx="84" cy="42" r="2"><animate attributeName="opacity" values=".25;1;.25" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="252" cy="70" r="1.5"><animate attributeName="opacity" values="1;.2;1" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="441" cy="31" r="2"><animate attributeName="opacity" values=".3;1;.3" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="716" cy="58" r="1.5"/><circle cx="958" cy="35" r="2"><animate attributeName="opacity" values="1;.25;1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1268" cy="58" r="1.5"/><circle cx="1492" cy="27" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="4s" repeatCount="indefinite"/></circle>
  </g>
  <text x="800" y="158" fill="#dfe4ff" font-family="Cascadia Code, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="5" text-anchor="middle">CONSTRUIRE  ·  SÉCURISER  ·  APPRENDRE</text>
</svg>
