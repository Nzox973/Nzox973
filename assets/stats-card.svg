  <circle cx="58" cy="307" r="5" fill="#00e5ff" filter="url(#glow)"/>
  <text x="76" y="313" fill="#dfe4ff" font-family="Cascadia Code, Consolas, monospace" font-size="13" letter-spacing="1">40+ COMMITS  ·  3 DÉPÔTS PYTHON  ·  1 PORTFOLIO</text>
