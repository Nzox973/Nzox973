    <text x="18" y="78" fill="#f7fbff" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="700">50+</text>
    <text x="18" y="113" fill="#00e5ff" font-family="Cascadia Code, Consolas, monospace" font-size="13" font-weight="700">CONTRIBUTIONS</text>
