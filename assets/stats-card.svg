<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Statistiques GitHub de Nzox973 au 25 juillet 2026</title>
  <desc id="desc">Plus de 50 contributions sur douze mois, 5 dépôts publics, plus de 5 pull requests et 3 projets principaux.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00e5ff"/>
      <stop offset=".48" stop-color="#6a24c8"/>
      <stop offset="1" stop-color="#f42cd6"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b0924"/>
