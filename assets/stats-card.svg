  <text x="724" y="38" fill="#8d87b8" font-family="Cascadia Code, Consolas, monospace" font-size="13" text-anchor="end">CHECKPOINT · 25.07.2026</text>
  <path d="M28 61h704" stroke="url(#edge)" stroke-opacity=".42"/>

  <g transform="translate(34 88)">
